<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Cine Hub — Studio Console</title>
<style>
  [data-theme="dark"]{
    --bg:#080808; --bg2:#0f0d09; --panel:#141210; --panel2:#191510; --line:#26221a;
    --gold:#d8b45a; --gold-dim:#8a7538; --gold-soft:#241d0f;
    --text:#f4f1ea; --mut:#8f887c;
    --font-display:Georgia,"Times New Roman",serif; --radius:10px;
    --sidebar:#0c0a07; --hover:#1c1710;
    --ok:#4caf7d; --ok-bg:#12261c; --warn:#e0a83a; --warn-bg:#2a2110; --bad:#e06a5a; --bad-bg:#2a1512; --info:#6ea8d8; --info-bg:#12202a;
    --shadow:0 10px 34px rgba(0,0,0,.5);
  }
  [data-theme="light"]{
    --bg:#f4f2ec; --bg2:#eceae2; --panel:#ffffff; --panel2:#faf8f2; --line:#e4dfd4;
    --gold:#a9822b; --gold-dim:#c9a24a; --gold-soft:#f2e8d0;
    --text:#1c1a17; --mut:#7a746a;
    --font-display:-apple-system,"Segoe UI",Roboto,sans-serif; --radius:12px;
    --sidebar:#1a1712; --hover:#f0ece2;
    --ok:#1f8a5b; --ok-bg:#e3f3ea; --warn:#a9791a; --warn-bg:#f7edd6; --bad:#c0472f; --bad-bg:#f7e3de; --info:#2c6fa0; --info-bg:#e0edf6;
    --shadow:0 10px 28px rgba(28,26,23,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
  a{color:inherit;text-decoration:none}
  .disp{font-family:var(--font-display)}
  .app{display:flex;min-height:100vh}
  /* sidebar */
  .sidebar{width:236px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;color:#eee}
  .sb-logo{display:flex;align-items:center;gap:11px;padding:18px 18px 16px}
  .sb-logo img{width:40px;height:40px;border-radius:9px}
  .sb-logo b{font-family:var(--font-display);font-size:16px;letter-spacing:.02em;color:#f4f1ea;line-height:1.1}
  .sb-logo span{display:block;font-size:9px;letter-spacing:.34em;color:#8f887c;margin-top:3px}
  .nav{padding:6px 10px;flex:1}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#cfc9bd;font-size:13.5px;font-weight:500;margin-bottom:2px;cursor:pointer}
  .nav a .ic{width:18px;text-align:center;font-size:15px;opacity:.9}
  .nav a:hover{background:rgba(255,255,255,.05);color:#fff}
  .nav a.active{background:var(--gold);color:#000;font-weight:600}
  .nav .grp{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6a6459;padding:14px 12px 6px}
  .sb-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08)}
  .sb-foot label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6a6459;display:block;margin-bottom:6px}
  .sb-foot select{width:100%;background:#000;border:1px solid rgba(255,255,255,.12);color:#eee;border-radius:8px;padding:8px;font-size:13px}
  /* main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px}
  .topbar h1{font-family:var(--font-display);font-size:22px;font-weight:700}
  .topbar .crumb{color:var(--mut);font-size:13px}
  .spacer{flex:1}
  .tsearch{position:relative}
  .tsearch input{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 14px 9px 32px;color:var(--text);font-size:13px;width:210px}
  .tsearch input:focus{outline:none;border-color:var(--gold)}
  .tsearch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut)}
  .toggle{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:none;color:var(--text);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600}
  .toggle:hover{border-color:var(--gold)}
  .who{display:flex;align-items:center;gap:9px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .content{padding:24px 26px 60px;max-width:1240px;width:100%;margin:0 auto}
  /* generic */
  .btn{padding:10px 16px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid transparent;font-family:inherit}
  .btn-primary{background:var(--gold);color:#000}.btn-primary:hover{filter:brightness(1.08)}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--text)}.btn-ghost:hover{border-color:var(--gold)}
  .btn-danger{color:var(--bad)}.btn-danger:hover{border-color:var(--bad);background:var(--bad-bg)}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
  .metric{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .metric .l{color:var(--mut);font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
  .metric .v{font-family:var(--font-display);font-size:34px;line-height:1}
  .metric .v.gold{color:var(--gold)}
  .metric .s{color:var(--mut);font-size:12px;margin-top:6px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .card-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .card-h h3{font-family:var(--font-display);font-size:17px}
  .card-h .lnk{color:var(--gold);font-size:13px;font-weight:600;cursor:pointer}
  .list-row{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;cursor:pointer}
  .list-row:last-child{border-bottom:none}
  .list-row:hover{background:var(--hover)}
  .list-row .grow{flex:1;min-width:0}
  .list-row .t{font-weight:600;font-size:14px}
  .list-row .sub{color:var(--mut);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:4px 9px;border-radius:999px;text-transform:capitalize;white-space:nowrap}
  .b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)}
  .b-bad{background:var(--bad-bg);color:var(--bad)} .b-info{background:var(--info-bg);color:var(--info)}
  .b-mut{background:var(--gold-soft);color:var(--gold)}
  .amt{font-variant-numeric:tabular-nums;font-weight:600}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--hover)}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:8px 15px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;background:var(--panel)}
  .tab.active,.tab:hover{border-color:var(--gold);color:var(--text);background:var(--gold-soft)}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:6px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--text);font-size:14px;font-family:inherit}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
  .r2{display:flex;gap:11px}.r2 .field{flex:1}
  .muted{color:var(--mut)} .gold{color:var(--gold)}
  .sec-title{font-family:var(--font-display);font-size:18px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
  .pill{font-size:11px;font-weight:700;color:var(--gold);background:var(--gold-soft);padding:3px 9px;border-radius:999px}
  .empty{color:var(--mut);text-align:center;padding:30px;font-size:13.5px}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
  .ov.show{display:flex}
  .modal{background:var(--bg2);border:1px solid var(--gold-dim);border-radius:14px;max-width:440px;width:100%;padding:26px;max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
  .modal h3{font-family:var(--font-display);font-size:21px;margin-bottom:4px}
  .modal .mut{color:var(--mut);font-size:13px;margin-bottom:18px}
  .preview{background:var(--gold-soft);border-radius:9px;padding:11px 13px;font-size:13px;color:var(--gold);margin:6px 0 16px;font-weight:600}
  /* toast */
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(140%);background:var(--gold);color:#000;padding:12px 20px;border-radius:10px;font-weight:600;font-size:13.5px;z-index:70;transition:.28s;box-shadow:var(--shadow)}
  .toast.show{transform:translateX(-50%)}
  /* quick rent */
  .qr{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:start}
  @media(max-width:980px){.qr{grid-template-columns:1fr}}
  .qr-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;cursor:pointer;background:var(--panel)}
  .qr-item:hover{border-color:var(--gold)}
  .qr-item.added{border-color:var(--gold);background:var(--gold-soft)}
  .qr-item.dim{opacity:.4;cursor:not-allowed}
  .qr-item .grow{flex:1}
  .qr-thumb{width:42px;height:42px;border-radius:8px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:18px}
  .cart-line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .cart-line input{width:92px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px;color:var(--text);font-size:13px;text-align:right}
  .cart-x{cursor:pointer;color:var(--mut);font-weight:700;width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .cart-x:hover{color:var(--bad);background:var(--bad-bg)}
  /* amount fields as plain text boxes (no spinner arrows) */
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .total-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0 4px;font-family:var(--font-display);font-size:20px}
  /* calendar timeline (Gantt) */
  .cal-wrap{position:relative}
  .cal-head,.cal-row{display:flex;border-bottom:1px solid var(--line)}
  .cal-row:last-child{border-bottom:none}
  .cal-label{width:190px;flex-shrink:0;padding:10px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;background:var(--panel)}
  .cal-track{position:relative;height:50px;flex-shrink:0}
  .cal-head .cal-track{height:42px;display:flex}
  .cal-day{flex-shrink:0;text-align:center;font-size:11px;color:var(--mut);padding-top:7px;border-right:1px solid var(--line)}
  .cal-day span{display:block;font-size:9px;opacity:.7}
  .cal-day.we{background:var(--panel2)}
  .cal-bar{position:absolute;top:8px;height:34px;border-radius:8px;font-size:11.5px;font-weight:700;padding:0 9px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;cursor:pointer}
  .cal-bar:hover{filter:brightness(1.06);z-index:3}
  .bar-conf{background:var(--info-bg);color:var(--info);border:1px solid var(--info)}
  .bar-out{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
  .bar-res{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
  .bar-bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
  .cal-todayline{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);z-index:4;pointer-events:none}
  .cal-todayline:before{content:"today";position:absolute;top:-2px;left:4px;font-size:9px;color:var(--gold);font-weight:700}
  /* receipt / invoice — always a white paper sheet */
  .rc-actions{display:flex;gap:10px;margin-bottom:16px}
  .receipt{max-width:820px;margin:0 auto;background:#fff;color:#1a1a1a;border-radius:10px;box-shadow:var(--shadow);padding:44px 48px}
  .rc-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1a1a1a;padding-bottom:20px;gap:20px}
  .rc-brand{display:flex;gap:14px;align-items:center}
  .rc-brand img{width:54px;height:54px;border-radius:10px}
  .rc-brand b{font-size:20px;font-family:Georgia,serif;display:block}
  .rc-brand span{color:#666;font-size:12.5px}
  .rc-meta{text-align:right;flex-shrink:0}
  .rc-meta h2{font-size:24px;letter-spacing:.12em;color:#a9822b;margin-bottom:4px}
  .rc-meta div{font-size:12.5px;color:#444}
  .rc-parties{display:flex;justify-content:space-between;gap:30px;margin:24px 0}
  .rc-parties label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#999;margin-bottom:5px}
  .rc-parties b{font-size:15px} .rc-parties .v{font-size:13.5px;color:#333;line-height:1.6}
  .rc-table{width:100%;border-collapse:collapse;margin:8px 0 4px}
  .rc-table th{background:#f4efe2;color:#7a5f1a;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:10px 12px;text-align:left}
  .rc-table th.r,.rc-table td.r{text-align:right}
  .rc-table td{padding:11px 12px;border-bottom:1px solid #eee;font-size:13px;color:#222;vertical-align:top;word-break:break-word}
  .rc-table tbody tr:nth-child(even){background:#faf8f2}
  .rc-table td .c{color:#999;font-size:11px}
  .rc-sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:40px;gap:30px}
  .rc-sign .box{min-width:210px;text-align:center}
  .rc-sign .line{border-top:1.5px solid #1a1a1a;padding-top:6px;font-size:12px;color:#555}
  .rc-sign .name{font-size:13px;color:#1a1a1a;font-weight:600;margin-bottom:2px}
  .rc-totals{width:300px;margin-left:auto;margin-top:14px}
  .rc-totals .row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;color:#333}
  .rc-totals .row.grand{border-top:2px solid #1a1a1a;margin-top:6px;padding-top:12px;font-weight:700;font-size:17px;color:#1a1a1a}
  .rc-totals .due{color:#c0472f} .rc-totals .paid{color:#1f8a5b}
  .rc-pay{margin-top:26px}
  .rc-pay h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#999;margin-bottom:8px}
  .rc-pay .p{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #f0f0f0;color:#333}
  .rc-foot{margin-top:30px;padding-top:18px;border-top:1px solid #eee;color:#888;font-size:12px;text-align:center;line-height:1.6}
  .rc-stamp{display:inline-block;border:2px solid #1f8a5b;color:#1f8a5b;font-weight:800;letter-spacing:.1em;padding:6px 16px;border-radius:8px;transform:rotate(-6deg);font-size:15px}
  @media print{
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
    html,body{height:auto!important;overflow:visible!important;background:#fff!important;margin:0!important}
    .sidebar,.topbar,.rc-actions,.toast,.kitbar,.ov,.no-print,#loginOverlay{display:none!important}
    .app,.main,.content{display:block!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;margin:0!important;padding:0!important;max-width:none!important;width:auto!important;flex:none!important}
    .card{overflow:visible!important}
    .receipt{box-shadow:none!important;border-radius:0;margin:0;max-width:none;padding:0;color:#1a1a1a!important}
    /* keep rows whole and repeat the header on every printed page */
    .rc-table{page-break-inside:auto}
    .rc-table thead{display:table-header-group}
    .rc-table tr{page-break-inside:avoid}
    .rc-head,.rc-parties,.rc-totals,.rc-pay,.rc-foot,.rc-sign,.rc-stamp{page-break-inside:avoid}
  }
  @page{margin:14mm}
  @media(max-width:760px){.sidebar{display:none}}
  /* investor portal */
  .eyebrow-inv{color:var(--gold);letter-spacing:.2em;font-size:12px;text-transform:uppercase;font-weight:700;margin-bottom:8px}
  .cam-badges{display:flex;gap:8px;flex-wrap:wrap}
  .cam-badge{border:1px solid var(--gold-dim);color:var(--gold);background:var(--gold-soft);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
  .cam-badge:not(.active){opacity:.45;background:transparent}
  .cam-badge:hover{opacity:1}
  .ks-chip2{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold-dim);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
  .metric.tint{background:var(--gold-soft);border-color:var(--gold-dim)}
  .wf{display:grid;grid-template-columns:1fr 66px 140px;gap:12px;align-items:center;padding:13px 16px;border-radius:8px;margin-bottom:8px;background:var(--panel2)}
  .wf .p{color:var(--mut);font-size:13px;text-align:right}
  .wf .a{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .wf.good{background:var(--gold-soft)} .wf.good b{color:var(--gold)}
  .wf.pool{background:var(--ok-bg)} .wf.pool b{color:var(--ok)}
</style>
</head>
<body data-theme="dark">
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo"><img src="logo.png" alt="SRC"><div><b>Sri Cine Hub</b><span>STUDIO CONSOLE</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot" id="sbfoot"></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div><h1 id="pageTitle">Dashboard</h1></div>
      <div class="spacer"></div>
      <div class="tsearch"><span class="ic">🔍</span><input id="globalSearch" placeholder="Search bookings, gear, people…" onkeydown="if(event.key==='Enter')gsearch(this.value)"></div>
      <button class="toggle" onclick="toggleTheme()"><span id="themeIcon">☀</span><span id="themeLabel">Light</span></button>
      <div class="who"><div class="avatar" id="avatar">M</div></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20260828d"></script>
<script src="console-data.js?v=20260828d"></script>
<script src="console-db.js?v=20260828d"></script>
<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const parseD=s=>new Date(s+"T00:00:00");
const daysBetween=(s,e)=>Math.max(1,Math.ceil((parseD(e)-parseD(s))/86400000));
const fmtDate=s=>parseD(s).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const cust=id=>DATA.customers.find(c=>c.id===id)||{name:"—"};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}
/* ---- WhatsApp (Phase 1: click-to-chat, staff taps send) ---- */
const waEsc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");
const escAttr=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
function waSend(phone,msg){const d=(phone||"").replace(/[^0-9]/g,"");if(!d)return toast("No phone number on file");window.open(`https://wa.me/${d}?text=${encodeURIComponent(msg)}`,"_blank");}
async function sendQuoteWA(){
  const u=await ensureRequest(); if(u===null)return;
  const items=QB.filter(l=>l.type==='item'&&l.include&&l.name);
  const bdOf=l=>isEquip(l.kind)?billedDays(l.days):l.days;

function lineDays(b,l){const s=l.start||b.start;const e=l.returnedAt||l.end||b.end;return daysBetween(s,e);}
function bookingTotals(b){

/* Return human-readable clash notes for any of `codes` already committed over [start,end]. */
function unitClashes(codes,start,end){
  const s=parseD(start),e=parseD(end),held=["confirmed","checked_out","overdue"];
  const set=new Set(codes),out=[];
  (DATA.bookings||[]).forEach(b=>{
    if(!held.includes(b.status))return;
    const bs=parseD(b.start),be=parseD(b.end);
    if(!(bs<=e&&s<=be))return; // no date overlap
    [...(b.cameras||[]),...(b.accessories||[])].forEach(l=>{
      if(set.has(l.code))out.push(`• ${l.name} (${l.code}) — on ${b.code} ${fmtDate(b.start)}–${fmtDate(b.end)}`);
    });
  });
  return out;
}
async function checkoutQR(){
  const name=(QR.name||"").trim();

  const clash=unitClashes(QR.cart.map(c=>c.code),QR.start,QR.end);
  if(clash.length&&!confirm(clash.join("\n")+"\n\nThese are already booked for overlapping dates. Create this booking anyway?"))return;
  const code="BK-2026-"+String(Date.now()).slice(-6);
  const prod=(QR.prod||"").trim(), phone=(QR.phone||"").trim();
  const b={code,customer:"CUS-new",production:prod||name,project:prod||"Walk-in booking",
    contact:name,phone,status:"confirmed",start:QR.start,end:QR.end,pickup:"Studio floor",operator:"",
    cameras:QR.cart.filter(c=>c.type==="camera").map(c=>({code:c.code,name:c.name,rate:c.rate,qty:c.qty||1,lineKind:'own'})),
    accessories:QR.cart.filter(c=>c.type==="accessory").map(c=>({code:c.code,name:c.name,rate:c.rate,qty:c.qty||1,lineKind:'own'})),
    payments:[]};
  // Persist FIRST when online — only claim success if it actually saved.
  if(SDB.on){
    const btn=event&&event.target;if(btn){btn.disabled=true;btn.textContent="Saving…";}

    if(btn){btn.disabled=false;btn.textContent="Check Out →";}
    if(!ok)return; // fail() already showed the real reason; keep the cart intact so nothing is lost
  }

    const aliases=QB_ALIASES[name]||[];
    aliases.forEach(k=>{ if(n.includes(qbNorm(k))){ s+=3; alias=true; } });                 // aliases: substring (curated)
    const nameToks=qbNorm(name).split(' ').filter(t=>t.length>2);
    nameToks.forEach(t=>{ if(words.includes(t)) s+=1; });                                     // name tokens: word-boundary
    const keys=aliases.filter(k=>!k.includes(' ')).map(qbNorm).concat(nameToks).filter(k=>k.length>=4);

function parseRows(text){                       // classifies every line; drops nothing

    if(qbIsHeader(trimmed)){ rows.push({type:'header',name:trimmed,raw:line}); return; }

function renderQB(){

    else svc+=l.rate*l.days*qty; });
  const subtotal=equip+svc;
  const discount=qbDiscount(subtotal);

    <div style="display:flex;justify-content:space-between;font-family:var(--font-display);font-size:19px;padding:6px 0;border-top:1px solid var(--line);margin-top:4px"><span>Total payable</span><span class="gold">${money(total)}</span></div>
    ${margin>0?`<div class="muted" style="font-size:12px;text-align:right;margin-top:2px">incl. <span class="gold">${money(margin)}</span> hire-in margin</div>`:''}
  </div>`;
  const orig=$("#qb-original"); if(orig) orig.innerHTML = QB_SOURCE? `<details style="margin:4px 0 12px"><summary style="cursor:pointer;color:var(--mut);font-size:12px">📄 Original request (as received — nothing dropped)</summary><pre style="white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;color:var(--text);margin-top:6px;font-family:inherit">${(QB_SOURCE||'').replace(/</g,'&lt;')}</pre></details>` : '';
}
function addDays(d,n){ const x=parseD(d); x.setDate(x.getDate()+(+n||0)); return x.toISOString().slice(0,10); }

      <div class="muted" style="font-size:13px;margin-top:2px">${meta} · ${fmtDate(b.start)}–${fmtDate(b.end)}</div></div>
    ${badge(b.status)}
    <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="openReceipt('${b.code}')">🧾 Invoice</button>
  </div>

}
function confirmOps(code,newStatus,print){
  const b=DATA.bookings.find(x=>x.code===code);
  const handle=(list,type,cam)=>list.forEach((l,idx)=>{
    if(l.lineKind!=='hirein'&&l.lineKind!=='custom' && (l.unassigned||(l.code&&l.code.indexOf('(')===0))){
      const sel=$("#asn-"+type+"-"+idx);
      if(sel&&sel.value){ const uc=sel.value; l.code=uc; l.unassigned=false; const unit=(cam?DATA.cameras:DATA.accessories).find(u=>u.code===uc); if(unit)unit.status='booked'; SDB.assignUnit(l._lineId,uc); }
    }
    const mh=$("#mh-"+type+"-"+idx), cond=$("#cond-"+type+"-"+idx);
    if(cam&&mh&&mh.value!==""){ const v=+mh.value||0; if(newStatus==="checked_out")l.checkoutHours=v; else {l.returnHours=v; const unit=DATA.cameras.find(u=>u.code===l.code); if(unit)unit.meterHours=v;} }
    if(cond){ if(newStatus==="checked_out")l.conditionOut=cond.value; else l.conditionIn=cond.value; }
  });
  handle(b.cameras,'cam',true); handle(b.accessories,'acc',false);
  // Optional payment captured on the ops screen.
  const amtEl=$("#co-amt"); const amt=amtEl?+(amtEl.value||0):0;
  if(amt>0){ const pay={amount:amt,type:newStatus==="returned"?'final':'advance',method:($("#co-method")||{}).value||'Cash',date:TODAY,ref:($("#co-ref")||{}).value||''}; b.payments.push(pay); SDB.addPayment(code,pay); }
  b.status=newStatus;SDB.confirmOps(b,newStatus);
  toast((amt>0?money(amt)+" recorded · ":"")+"Marked "+newStatus.replace("_"," "));
  if(print) openReceipt(code); else go(newStatus==="returned"?"receipts":"checkout");
}

/* ---- Calendar — booking timeline (Gantt) ---- */
VIEWS.calendar=()=>{
  const DAYS=28, CELL=40, LABEL=190;
  const start=parseD(TODAY); start.setDate(start.getDate()-5); // window opens 5 days before today, always current
  const dayList=[...Array(DAYS)].map((_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d;});
  const offset=ds=>Math.round((parseD(ds)-start)/86400000);
  const todayOff=offset(TODAY);
  const barCls=s=>s==="overdue"?"bar-bad":s==="reserved"?"bar-res":s==="checked_out"?"bar-out":"bar-conf";
  const header=dayList.map(d=>{const we=d.getDay()===0||d.getDay()===6;return `<div class="cal-day ${we?'we':''}" style="width:${CELL}px">${d.getDate()}<span>${d.toLocaleDateString("en-IN",{month:"short"})}</span></div>`;}).join("");
  const rows=DATA.cameras.map(cam=>{
    const bars=DATA.bookings.filter(b=>b.status!=="returned"&&b.cameras.some(c=>c.code===cam.code)).map(b=>{
      let s=offset(b.start), e=offset(b.end);
      if(e<0||s>DAYS-1)return "";
      s=Math.max(0,s);e=Math.min(DAYS-1,e);
      const left=s*CELL, width=(e-s+1)*CELL-5;
      return `<div class="cal-bar ${barCls(b.status)}" style="left:${left}px;width:${width}px" onclick="openBooking('${b.code}')">${b.contact.split(" ")[0]} · ${b.project}</div>`;
    }).join("");
    return `<div class="cal-row"><div class="cal-label"><b>${cam.name}</b><div class="muted" style="font-size:11px">${cam.code}</div></div>
      <div class="cal-track" style="width:${DAYS*CELL}px">${bars||''}</div></div>`;
  }).join("");
  const todayLine=(todayOff>=0&&todayOff<DAYS)?`<div class="cal-todayline" style="left:${LABEL+todayOff*CELL}px"></div>`:"";
  return `<p class="muted" style="margin-bottom:14px">Booking timeline — each bar is a booking across its dates; click to open it.
    <span class="badge b-info" style="margin-left:8px">confirmed</span> <span class="badge b-ok">out</span> <span class="badge b-warn">reserved</span> <span class="badge b-bad">overdue</span></p>
  <div class="card" style="overflow-x:auto"><div class="cal-wrap" style="min-width:${LABEL+DAYS*CELL}px">
    <div class="cal-head"><div class="cal-label" style="font-weight:600">Camera</div><div class="cal-track" style="width:${DAYS*CELL}px">${header}</div></div>
    ${rows}
    ${todayLine}
  </div></div>`;
};

  const gross=totalReceived;
  const maint=Math.round(gross*cfg.maintenancePct), mgr=Math.round(gross*cfg.managerPct), pool=gross-maint-mgr;

  const monthKeys=Object.keys(months).sort().reverse();
  const settlementFor=mk=>DATA.settlements.find(s=>s.cam===cam.code&&s.month===mk);

  return `

      <div class="muted" style="margin-top:6px">${periodLbl}</div></div>
    <div class="cam-badges">${invCams.map(c=>`<span class="cam-badge ${c.code===cam.code?'active':''}" onclick="INVEST.cam='${c.code}';go('investor')">${c.code} · ${c.manufacturer} ${c.model}</span>`).join("")}</div>
  </div>

  <div style="display:flex;align-items:center;gap:8px;margin:22px 0 20px;flex-wrap:wrap">
    <span class="muted" style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-right:4px">Period</span>
    ${["all","2026","2025","2024","2023"].map(p=>`<div class="tab ${INVEST.period===p?'active':''}" onclick="INVEST.period='${p}';go('investor')">${p==="all"?"All time":p}</div>`).join("")}
  </div>

  <div class="card" style="margin-bottom:18px"><div class="card-h"><h3>Revenue Waterfall · ${periodLbl}</h3></div>
    <div style="padding:16px">
      <div class="wf good"><b>Gross revenue received</b><span class="p">100%</span><span class="a" style="color:var(--gold)">${money(gross)}</span></div>
      <div class="wf"><span>− Maintenance</span><span class="p">${(cfg.maintenancePct*100).toFixed(1)}%</span><span class="a" style="color:var(--bad)">− ${money(maint)}</span></div>
      <div class="wf"><span>− Rental Manager</span><span class="p">${(cfg.managerPct*100).toFixed(1)}%</span><span class="a" style="color:var(--bad)">− ${money(mgr)}</span></div>
      <div class="wf pool"><b>Investor pool (${(poolPct*100).toFixed(1)}% of gross)</b><span class="p">${(poolPct*100).toFixed(1)}%</span><span class="a" style="color:var(--ok)">${money(pool)}</span></div>
    </div></div>

  <div class="metrics">
    ${tile("Total booked",shipped.length,"bookings")}
    ${tile("Active now",activeNow,"in progress")}
    ${tile("Total billed",money(totalBilled),periodLbl,true)}
    ${tile("Received",money(totalReceived),"gross payments",true)}
    ${tile("Investor pool",money(pool),`after ${(dedPct*100).toFixed(1)}% deductions`,true)}
    ${tile("Camera cost",money(cam.cost),"total investment")}
  </div>

  <div class="card" style="margin:18px 0"><div class="card-h"><h3>Investor Revenue Share · ${periodLbl}</h3></div>
    <div class="muted" style="padding:12px 16px 4px;font-size:12px">Pool % = share of investor pool (${(poolPct*100).toFixed(0)}% of gross) · Gross % = effective share of total revenue</div>
    <table><thead><tr><th>Investor</th><th>Pool %</th><th>Gross %</th><th>Invested</th><th>Billed share</th><th>Received share</th><th>Paid out</th><th>ROI</th></tr></thead><tbody>
    ${cam.investors.map(iv=>{const ps=iv.invested/totalInvested;const gs=ps*poolPct;const bs=billedPool*ps;const rs=pool*ps;const paid=payoutsFor(iv.name);const roi=iv.invested>0?rs/iv.invested*100:0;
      return `<tr><td><b>${iv.name}</b>${iv.loc?`<div class="muted" style="font-size:11px">${iv.loc}</div>`:''}</td>
        <td class="gold">${(ps*100).toFixed(2)}%</td><td class="gold">${(gs*100).toFixed(2)}%</td>
        <td class="amt">${money(iv.invested)}</td><td class="amt">${money(round1(bs))}</td>
        <td class="amt" style="color:var(--ok)">${money(round1(rs))}</td>
        <td>${paid>0?money(paid):'<span class="muted">—</span>'}</td><td>${roi.toFixed(1)}%</td></tr>`;}).join("")}
    </tbody></table></div>

  <div class="card" style="margin-bottom:18px"><div class="card-h"><h3>Monthly Profit Sharing · ${periodLbl}</h3></div>
    <div class="muted" style="padding:12px 16px 4px;font-size:12px">Each month's investor pool is ${(poolPct*100).toFixed(0)}% of that month's received revenue. Settle a month once its payments are in — the split is divided by each investor's stake.</div>
    <table><thead><tr><th>Month</th><th>Bookings</th><th>Gross received</th><th>Investor pool</th><th>Split by investor</th><th style="text-align:right">Settlement</th></tr></thead><tbody>
    ${monthKeys.length?monthKeys.map(mk=>{const m=months[mk];const mpool=Math.round(m.recv*poolPct);const st=settlementFor(mk);
      const mlabel=parseD(mk+"-01").toLocaleDateString("en-IN",{month:"long",year:"numeric"});
      const split=cam.investors.map(iv=>`<div><b>${iv.name.split(" ")[0]}</b> ${money(round1(mpool*iv.invested/totalInvested))}</div>`).join("");
      return `<tr><td><b>${mlabel}</b></td><td>${m.bookings}</td><td class="amt">${money(m.recv)}</td>
        <td class="amt" style="color:var(--ok)">${money(mpool)}</td>
        <td class="muted" style="font-size:12px;line-height:1.7">${split}</td>
        <td style="text-align:right">${st?`<span class="badge b-ok">✓ settled ${fmtDate(st.date)}</span>`:`<button class="btn btn-primary btn-sm" onclick="settleMonth('${cam.code}','${mk}')">Settle up →</button>`}</td></tr>`;}).join(""):`<tr><td colspan="6" class="empty">No revenue to settle in this period.</td></tr>`}
    </tbody></table></div>

  <div class="card" style="margin-bottom:18px"><div class="card-h"><h3>All ${cam.manufacturer} bookings · ${periodLbl}</h3></div>
    ${rows.length?rows.map(r=>`<div class="list-row" onclick="openBooking('${r.b.code}')">
      <div class="grow"><div class="t">${r.b.code} · ${r.b.contact}</div><div class="sub">${r.b.project} · ${fmtDate(r.b.start)} → ${fmtDate(r.b.end)}</div></div>
      <div class="amt gold" style="margin-right:12px">${money(r.billed)}</div>${badge(r.b.status)}</div>`).join(""):'<div class="empty">No bookings in this period.</div>'}</div>

  <div class="card"><div class="card-h"><h3>Revenue · Receipts</h3></div>
    ${rows.filter(r=>r.b.status==="returned").length?rows.filter(r=>r.b.status==="returned").map(r=>`<div class="list-row" style="cursor:default">
      <div class="grow"><div class="t">RC-${r.b.code.slice(3)} · ${r.b.contact}</div><div class="sub">${r.b.code} · ${r.b.project} · ${fmtDate(r.b.end)}</div></div>
      <div class="amt gold">${money(r.billed)}</div></div>`).join(""):'<div class="empty">No receipts in this period.</div>'}</div>`;
};
function settleMonth(camCode,mk){
  const cam=DATA.cameras.find(c=>c.code===camCode);
  const totalInvested=cam.investors.reduce((a,i)=>a+i.invested,0);
  const poolPct=1-DATA.config.maintenancePct-DATA.config.managerPct;
  let recv=0;
  DATA.bookings.filter(b=>["checked_out","overdue","returned"].includes(b.status)&&b.start.slice(0,7)===mk&&b.cameras.some(c=>c.code===camCode))
    .forEach(b=>{const bt=bookingTotals(b);b.cameras.filter(c=>c.code===camCode).forEach(c=>{const billed=c.rate*lineDays(b,c)*(c.qty||1);recv+=bt.charges>0?Math.round(bt.paid*billed/bt.charges):0;});});
  const mpool=Math.round(recv*poolPct);
  DATA.settlements.push({cam:camCode,month:mk,date:mk+"-28",pool:mpool});
  cam.investors.forEach(iv=>DATA.payouts.push({cam:camCode,investor:iv.name,amount:round1(mpool*iv.invested/totalInvested),date:mk+"-28",mode:"Monthly settlement",month:mk,notes:mk}));
  SDB.settleMonth(camCode,mk);
  go("investor");toast("Settled "+parseD(mk+"-01").toLocaleDateString("en-IN",{month:"short",year:"numeric"}));
}

function renderUserChip(){
  const el=$("#sbfoot"); if(el) el.innerHTML = SDB.on
    ? `<div style="font-size:13px;color:#eee;font-weight:600">${MYNAME||'Staff'}</div><div style="font-size:11px;color:#8f887c;text-transform:capitalize;margin-bottom:10px">${ROLE}</div><button class="btn btn-ghost btn-sm" style="width:100%;color:#eee;border-color:rgba(255,255,255,.15)" onclick="signOutNow()">Sign out</button>`
    : `<div style="font-size:12px;color:#8f887c">Offline demo</div>`;
  const av=$("#avatar"); if(av) av.textContent=(MYNAME||ROLE||'U')[0].toUpperCase();
}
function showLogin(msg){
  let ov=document.getElementById('loginOverlay');
  if(!ov){ ov=document.createElement('div'); ov.id='loginOverlay'; document.body.appendChild(ov); }
  ov.setAttribute('style','position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px');
  const fld='width:100%;margin-bottom:14px;padding:16px 16px;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:11px;color:var(--text)';
  ov.innerHTML=`<div style="width:420px;max-width:100%;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:44px 40px;box-shadow:var(--shadow)">
    <img src="logo.png" style="width:84px;height:84px;border-radius:16px;margin-bottom:22px">
    <div style="font-family:var(--font-display);font-size:30px;margin-bottom:6px">Sri Cine Hub</div>
    <p style="color:var(--mut);font-size:15px;margin-bottom:30px">Studio console — staff sign in</p>
    <input id="li-email" placeholder="Email" autocomplete="username" style="${fld}">
    <input id="li-pw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" style="${fld}">
    <button class="btn btn-primary" style="width:100%;padding:15px;font-size:16px;margin-top:4px" onclick="doLogin()">Sign in</button>
    <div id="li-msg" style="color:var(--bad);font-size:13.5px;margin-top:14px;min-height:18px">${msg||''}</div>
  </div>`;
}
async function doLogin(){
  const email=$("#li-email").value.trim(), pw=$("#li-pw").value;
  $("#li-msg").textContent='Signing in…';
  const { error } = await SDB.signIn(email,pw);
  if(error){ $("#li-msg").textContent=error.message||'Sign in failed'; return; }
  location.reload();
}
async function signOutNow(){ await SDB.signOut(); location.reload(); }
/* Called by the data layer when any request fails with an expired/invalid session — go to the login page, never a scary all-zero console. */
let SESSION_ENDED=false;
window.onSessionExpired=async function(){ if(SESSION_ENDED)return; SESSION_ENDED=true; try{await SDB.signOut();}catch(e){} const app=document.querySelector('.app'); if(app)app.style.display='none'; showLogin('Your session expired — please sign in again.'); };
async function boot(){
  const app=document.querySelector('.app');
  if(!SDB.on){ ROLE='admin'; MYNAME='Demo'; await SDB.bootstrap(); app.style.display=''; buildNav(); renderUserChip(); go('dashboard'); return; }
  const user=await SDB.currentUser();
  if(!user){ app.style.display='none'; showLogin(); return; }
  const prof=await SDB.myProfile();
  if(!prof || !prof.is_active){ await SDB.signOut(); app.style.display='none'; showLogin('No active staff profile for this account. Ask an admin.'); return; }
  ROLE=prof.role; MYNAME=prof.full_name||user.email;
  const ov=document.getElementById('loginOverlay'); if(ov) ov.remove();
  const status=await SDB.bootstrap();
  if(status==='auth'){ await SDB.signOut(); app.style.display='none'; showLogin('Your session expired — please sign in again.'); return; }
  app.style.display=''; buildNav(); renderUserChip(); go('dashboard');
}
document.querySelector('.app').style.display='none';
boot();
</script>
</body>
</html>
